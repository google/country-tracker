name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: 'read'

jobs:
  test-and-check:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Country Configuration
        run: cp config/countries.example.json config/countries.json

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Tests with Coverage
        run: npm run test:coverage
