name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main # Only deploy when code merges to main

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GCP_REGION }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPO }}
  SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
  REGION: ${{ vars.GCP_REGION }}

jobs:
  test-and-deploy:
    name: Build, Test, and Deploy
    runs-on: ubuntu-latest
    
    # Required for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Google Auth (Workload Identity)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}' # Secure mapping to IAM Pool avoiding structural leaks
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}' # Encrypted SA email representing full deployment lifecycle keys

      - name: Docker Auth
        id: docker-auth
        uses: 'docker/login-action@v3'
        with:
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'

      - name: Generate .env file for build
        run: |-
          echo "NEXT_PUBLIC_BACKEND_TYPE=${{ vars.NEXT_PUBLIC_BACKEND_TYPE }}" >> .env
          echo "NEXT_PUBLIC_POCKETBASE_URL=${{ vars.NEXT_PUBLIC_POCKETBASE_URL }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}" >> .env

      - name: Generate country configuration for build
        env:
          COUNTRIES_JSON: ${{ vars.COUNTRIES_JSON }}
        run: |-
          if [ -n "$COUNTRIES_JSON" ]; then
            mkdir -p config
            printf '%s\n' "$COUNTRIES_JSON" > config/countries.json
          fi


      - name: Build and Push Docker Image
        run: |-
          DOCKER_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          NODE_VERSION=$(cat .nvmrc | tr -d 'v\n')
          
          docker build \
            --build-arg NODE_VERSION="${NODE_VERSION}" \
            --tag "${DOCKER_TAG}" \
            .
            
          docker push "${DOCKER_TAG}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |-
            NEXT_PUBLIC_BACKEND_TYPE=${{ vars.NEXT_PUBLIC_BACKEND_TYPE }}
            NEXT_PUBLIC_POCKETBASE_URL=${{ vars.NEXT_PUBLIC_POCKETBASE_URL }}
            APP_URL=${{ vars.APP_URL }}

      - name: Formulate Deploy URL
        run: echo "Deployed directly to ${{ steps.deploy.outputs.url }}"
